/* ============================================================
   SOUND ENGINE
   ============================================================ */
const Sound = {
  ctx: null,
  enabled: true,

  _init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { console.warn('Audio not supported', e); }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  _tone(freq, duration, type = 'sine', volume = 0.08, delay = 0) {
    if (!this.enabled || !this.ctx) return;
    const ctx = this.ctx;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  },

  play(name) {
    if (!this.enabled) return;
    this._init();
    if (!this.ctx) return;

    switch (name) {
      case 'click':
        this._tone(680, 0.045, 'sine', 0.05);
        break;
      case 'navigate':
        this._tone(520, 0.06, 'sine', 0.045);
        this._tone(780, 0.05, 'sine', 0.035, 0.04);
        break;
      case 'add':
        this._tone(660, 0.08, 'sine', 0.07);
        this._tone(990, 0.1, 'sine', 0.06, 0.07);
        break;
      case 'success':
        // Achievement chime - C5 E5 G5 C6
        this._tone(523.25, 0.14, 'sine', 0.09);
        this._tone(659.25, 0.14, 'sine', 0.09, 0.09);
        this._tone(783.99, 0.16, 'sine', 0.09, 0.18);
        this._tone(1046.50, 0.28, 'sine', 0.1, 0.28);
        break;
      case 'undo':
        this._tone(500, 0.08, 'sine', 0.06);
        this._tone(380, 0.1, 'sine', 0.05, 0.06);
        break;
      case 'delete':
        this._tone(320, 0.09, 'triangle', 0.06);
        this._tone(220, 0.14, 'triangle', 0.05, 0.07);
        break;
      case 'open':
        this._tone(440, 0.06, 'sine', 0.05);
        this._tone(660, 0.09, 'sine', 0.05, 0.05);
        break;
      case 'close':
        this._tone(660, 0.06, 'sine', 0.045);
        this._tone(440, 0.08, 'sine', 0.045, 0.05);
        break;
      case 'toggle':
        this._tone(880, 0.06, 'sine', 0.05);
        break;
      case 'error':
        this._tone(200, 0.12, 'square', 0.05);
        break;
    }
  },
};

function timeLeft(target) {
  const diff = Math.max(0, Math.floor((new Date(target).getTime() - Date.now()) / 1000));
  return {
    days: Math.floor(diff / 86400), hours: Math.floor((diff % 86400) / 3600),
    minutes: Math.floor((diff % 3600) / 60), seconds: diff % 60,
    total: diff, isPast: diff === 0,
  };
}

function useStore(key, initial) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : initial; }
    catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

function useEscapeKey(onEsc) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onEsc(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onEsc]);
}

/* ============================================================
   GLOBAL CLICK SOUND HANDLER
   ============================================================ */
function useGlobalClickSound() {
  useEffect(() => {
    const handler = e => {
      const btn = e.target.closest('button, a, [role="button"], [data-sound]');
      if (!btn) return;
      const custom = btn.dataset.sound;
      if (custom === 'none') return;
      if (custom) Sound.play(custom);
      else Sound.play('click');
    };
    document.addEventListener('click', handler, true);
    return () => document.removeEventListener('click', handler, true);
  }, []);
}

/* ============================================================
   MODAL
   ============================================================ */
function Modal({ children, onClose }) {
  useEscapeKey(onClose);
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, []);

  return (
    <div
      className="modal-wrap bg-slate-950/70 backdrop-blur-sm anim-backdrop"
      onClick={onClose}>
      <div
        onClick={e => e.stopPropagation()}
        className="modal-panel bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 anim-sheet focus-ring">
        {children}
      </div>
    </div>
  );
}

function ProgressRing({ progress, size = 80, strokeWidth = 8, color = 'white', track = 'rgba(255,255,255,0.25)', centerText }) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke={track} strokeWidth={strokeWidth} />
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke={color} strokeWidth={strokeWidth}
          strokeLinecap="round" strokeDasharray={circumference}
          strokeDashoffset={circumference * (1 - progress / 100)}
          style={{ transition: 'stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)' }} />
      </svg>
      {centerText && (
        <div className="absolute inset-0 flex items-center justify-center text-sm font-bold">
          {centerText}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   LIST PANEL
   ============================================================ */
function ListPanel({ items, kind, onToggle, onDelete, onAdd, showExamBadge, exams }) {
  const [filter, setFilter] = useState('all');
  const [groupByType, setGroupByType] = useState(true);

  const meta = LIST_META[kind];
  const types = meta.types;

  const filtered = useMemo(() => {
    if (filter === 'active') return items.filter(i => !i.completed);
    if (filter === 'done') return items.filter(i => i.completed);
    return items;
  }, [items, filter]);

  const grouped = useMemo(() => {
    if (!groupByType) return { 'الكل': filtered };
    const g = {};
    filtered.forEach(it => {
      const t = types.find(x => x.id === it.type);
      const label = t ? t.label : 'أخرى';
      if (!g[label]) g[label] = [];
      g[label].push(it);
    });
    const ordered = {};
    types.forEach(t => { if (g[t.label]) ordered[t.label] = g[t.label]; });
    Object.keys(g).forEach(k => { if (!ordered[k]) ordered[k] = g[k]; });
    return ordered;
  }, [filtered, groupByType, types]);

  const done = items.filter(i => i.completed).length;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <SegmentedTabs
          size="sm"
          value={filter}
          onChange={setFilter}
          options={[
            { id: 'all', label: `الكل (${items.length})` },
            { id: 'active', label: `نشطة (${items.length - done})` },
            { id: 'done', label: `مكتملة (${done})` },
          ]}
        />
        <button onClick={() => setGroupByType(g => !g)}
          className="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors focus-ring">
          {groupByType ? 'بدون تجميع' : 'تجميع حسب النوع'}
        </button>
      </div>

      {items.length === 0 ? (
        <EmptyState Icon={meta.icon} message={meta.emptyMsg}
          action={{ label: 'إضافة الآن', onClick: onAdd }} />
      ) : filtered.length === 0 ? (
        <div className="rounded-2xl bg-slate-50 dark:bg-slate-900/50 p-8 text-center text-sm text-slate-500 dark:text-slate-400">
          لا توجد عناصر مطابقة للفلتر
        </div>
      ) : (
        <div className="space-y-5">
          {Object.keys(grouped).map(groupLabel => {
            const groupItems = grouped[groupLabel];
            const typeObj = types.find(t => t.label === groupLabel);
            return (
              <div key={groupLabel}>
                {groupByType && (
                  <div className="mb-2 flex items-center gap-2">
                    {typeObj && <typeObj.Icon size={14} style={{ color: typeObj.color }} />}
                    <h4 className="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                      {groupLabel} · {groupItems.filter(i => i.completed).length}/{groupItems.length}
                    </h4>
                  </div>
                )}
                <div className="space-y-2">
                  {groupItems.map(it => {
                    const t = types.find(x => x.id === it.type);
                    const examRef = showExamBadge && it.examId && exams
                      ? exams.find(e => e.id === it.examId) : null;
                    const isDueSoon = kind === 'assignment' && it.dueDate && !it.completed
                      && new Date(it.dueDate).getTime() - Date.now() < 86400 * 3 * 1000
                      && new Date(it.dueDate).getTime() > Date.now();
                    const isOverdue = kind === 'assignment' && it.dueDate && !it.completed
                      && new Date(it.dueDate).getTime() < Date.now();
                    return (
                      <div key={it.id}
                        className={`group flex items-center gap-3 rounded-xl bg-white dark:bg-slate-900 p-3 border transition-all ${
                          it.completed
                            ? 'opacity-60 border-slate-200 dark:border-slate-800'
                            : 'border-slate-200 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-indigo-700'
                        }`}>
                        <button onClick={() => onToggle(it.id)} data-sound={it.completed ? 'undo' : 'success'}
                          className="flex-shrink-0 focus-ring rounded-full">
                          {it.completed ? (
                            <div className="flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-white anim-check">
                              <ICheck size={16} />
                            </div>
                          ) : (
                            <ICircle size={24} className="text-slate-300 dark:text-slate-600" />
                          )}
                        </button>

                        {t && !groupByType && <t.Icon size={14} style={{ color: t.color }} className="flex-shrink-0" />}

                        <div className="flex-1 min-w-0">
                          <p className={`text-sm font-medium truncate ${
                            it.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'
                          }`}>{it.title}</p>
                          <div className="flex items-center flex-wrap gap-2 mt-0.5">
                            {examRef && (
                              <span className="inline-flex items-center gap-1 text-[10px] font-semibold text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-950/50 rounded-md px-1.5 py-0.5 border border-purple-200 dark:border-purple-900/60">
                                <ITimer size={9} /> {examRef.title}
                              </span>
                            )}
                            {it.dueDate && (
                              <p className={`text-[11px] flex items-center gap-1 ${
                                isOverdue ? 'text-red-500 font-semibold'
                                : isDueSoon ? 'text-orange-500 font-semibold'
                                : 'text-slate-500 dark:text-slate-400'
                              }`}>
                                <ICal size={10} />
                                {isOverdue ? 'فات: ' : isDueSoon ? 'قريب: ' : 'ينتهي: '}
                                {new Date(it.dueDate).toLocaleDateString('ar-SA', { dateStyle: 'medium' })}
                              </p>
                            )}
                          </div>
                        </div>

                        <button onClick={() => onDelete(it.id)} data-sound="delete"
                          className="opacity-0 group-hover:opacity-100 sm:opacity-60 rounded-lg p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-all flex-shrink-0 focus-ring">
                          <ITrash size={14} />
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   NOTES PANEL
   ============================================================ */
function NotesPanel({ notes, onAdd, onDelete }) {
  const [text, setText] = useState('');
  const add = () => { if (!text.trim()) return; onAdd(text.trim()); setText(''); };

  return (
    <div className="space-y-3">
      <div className="rounded-2xl bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800">
        <textarea
          value={text}
          onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) add(); }}
          placeholder="اكتب ملاحظتك هنا..."
          rows={3}
          className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 resize-none focus:border-indigo-500 dark:focus:border-indigo-500 transition-colors"
        />
        <div className="mt-3 flex items-center justify-between">
          <span className="text-[11px] text-slate-400 dark:text-slate-500">Ctrl+Enter للحفظ السريع</span>
          <button disabled={!text.trim()} onClick={add} data-sound={text.trim() ? 'add' : 'none'}
            className={`rounded-xl px-5 py-2 text-sm font-semibold transition-all focus-ring ${
              text.trim()
                ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-500/25 active:scale-95'
                : 'bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 cursor-not-allowed'
            }`}>
            حفظ
          </button>
        </div>
      </div>

      {notes.length === 0 ? (
        <EmptyState Icon={INote} message="لا توجد ملاحظات بعد" />
      ) : (
        <div className="space-y-2">
          {notes.map(n => (
            <div key={n.id}
              className="group flex items-start gap-3 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/60 p-4">
              <INote size={16} className="text-amber-500 flex-shrink-0 mt-0.5" />
              <p className="flex-1 text-sm text-slate-700 dark:text-slate-200 whitespace-pre-wrap break-words">{n.text}</p>
              <button onClick={() => onDelete(n.id)} data-sound="delete"
                className="opacity-0 group-hover:opacity-100 sm:opacity-60 text-slate-400 hover:text-red-500 transition-all focus-ring rounded-lg p-1">
                <ITrash size={14} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [subjects, setSubjects] = useStore('sp4_subjects', []);
  const [exams, setExams] = useStore('sp4_exams', []);
  const [items, setItems] = useStore('sp4_items', []);
  const [notes, setNotes] = useStore('sp4_notes', []);
  const [sessions, setSessions] = useStore('sp4_sessions', []);
  const [dark, setDark] = useStore('sp4_dark', false);
  const [soundEnabled, setSoundEnabled] = useStore('sp4_sound', true);

  const [view, setView] = useState('dashboard');
  const [activeSubjectId, setActiveSubjectId] = useState(null);
  const [activeExamId, setActiveExamId] = useState(null);
  const [modal, setModal] = useState(null);

  useGlobalClickSound();

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    document.body.classList.toggle('dark', dark);
  }, [dark]);

  useEffect(() => {
    Sound.enabled = soundEnabled;
  }, [soundEnabled]);

  const closeModal = () => setModal(null);

  const navigate = (v, id) => {
    Sound.play('navigate');
    setView(v);
    if (v === 'subject') setActiveSubjectId(id);
    if (v === 'exam') setActiveExamId(id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  /* ---------- Mutations ---------- */
  const addSubject = s => { setSubjects(p => [...p, { id: uid(), createdAt: Date.now(), ...s }]); closeModal(); };
  const addExam = e => { setExams(p => [...p, e]); closeModal(); };

  const deleteSubject = id => {
    setSubjects(p => p.filter(s => s.id !== id));
    setItems(p => p.filter(i => i.subjectId !== id));
    setNotes(p => p.filter(n => n.subjectId !== id));
    setExams(p => p.filter(e => e.subjectId !== id));
    if (activeSubjectId === id) navigate('subjects');
    closeModal();
  };

  const deleteExam = id => {
    setExams(p => p.filter(e => e.id !== id));
    // Remove examId from items but keep them under the subject
    setItems(p => p.map(i => i.examId === id ? { ...i, examId: null } : i));
    setNotes(p => p.filter(n => n.examId !== id));
    if (activeExamId === id) navigate('exams');
    closeModal();
  };

  const addItems = newItems => { setItems(p => [...p, ...newItems]); closeModal(); };
  const toggleItem = id => setItems(p => p.map(i => i.id === id
    ? { ...i, completed: !i.completed, completedAt: !i.completed ? Date.now() : null } : i));
  const deleteItem = id => setItems(p => p.filter(i => i.id !== id));

  const addNote = n => setNotes(p => [n, ...p]);
  const deleteNote = id => setNotes(p => p.filter(n => n.id !== id));
  const addSession = s => setSessions(p => [...p, s]);

  /* ---------- Derived ---------- */
  const activeSubject = subjects.find(s => s.id === activeSubjectId);
  const activeExam = exams.find(e => e.id === activeExamId);

  const openAddItems = (kind, ctx) => setModal({ type: 'items', kind, ...ctx });

  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-950">
      <header className="sticky top-0 z-30 glass border-b border-slate-200 dark:border-slate-800">
        <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
          <button onClick={() => navigate('dashboard')} className="flex items-center gap-2 focus-ring rounded-xl">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-500/30">
              <IBook size={18} />
            </div>
            <span className="text-lg font-bold">مذاكرة</span>
          </button>
          <div className="flex items-center gap-1">
            <button onClick={() => setSoundEnabled(!soundEnabled)}
              data-sound="none"
              className="rounded-xl p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus-ring">
              {soundEnabled ? <IVolume size={18} /> : <IVolumeX size={18} />}
            </button>
            <button onClick={() => setModal({ type: 'pomodoro' })}
              className="rounded-xl p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus-ring">
              <ITimer size={18} />
            </button>
            <button onClick={() => setDark(!dark)}
              className="rounded-xl p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus-ring">
              {dark ? <ISun size={18} /> : <IMoon size={18} />}
            </button>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-5xl px-4 py-6 pb-28">
        <div key={view + (activeSubjectId || '') + (activeExamId || '')} className="anim-fade-up">
          {view === 'dashboard' && (
            <Dashboard
              subjects={subjects} exams={exams} items={items} sessions={sessions}
              onNavigate={navigate}
              onAddSubject={() => setModal({ type: 'subject' })}
              onAddExam={() => {
                if (subjects.length === 0) {
                  Sound.play('error');
                  setModal({ type: 'needSubject' });
                } else {
                  setModal({ type: 'exam' });
                }
              }} />
          )}
          {view === 'subjects' && (
            <SubjectsView
              subjects={subjects} items={items}
              onNavigate={navigate}
              onAdd={() => setModal({ type: 'subject' })}
              onDelete={id => setModal({ type: 'confirm', what: 'subject', id })} />
          )}
          {view === 'subject' && activeSubject && (
            <SubjectDetail
              subject={activeSubject}
              items={items.filter(i => i.subjectId === activeSubject.id)}
              notes={notes.filter(n => n.subjectId === activeSubject.id)}
              exams={exams.filter(e => e.subjectId === activeSubject.id)}
              onBack={() => navigate('subjects')}
              onToggleItem={toggleItem}
              onDeleteItem={deleteItem}
              onAddItems={kind => openAddItems(kind, { subjectId: activeSubject.id })}
              onAddNote={n => addNote(n)}
              onDeleteNote={deleteNote} />
          )}
          {view === 'exams' && (
            <ExamsView
              exams={exams} items={items} subjects={subjects}
              onAdd={() => {
                if (subjects.length === 0) {
                  Sound.play('error');
                  setModal({ type: 'needSubject' });
                } else {
                  setModal({ type: 'exam' });
                }
              }}
              onDelete={id => setModal({ type: 'confirm', what: 'exam', id })}
              onOpen={id => navigate('exam', id)} />
          )}
          {view === 'exam' && activeExam && (
            <ExamDetail
              exam={activeExam}
              subject={subjects.find(s => s.id === activeExam.subjectId)}
              items={items.filter(i => i.examId === activeExam.id)}
              notes={notes.filter(n => n.examId === activeExam.id)}
              onBack={() => navigate('exams')}
              onToggleItem={toggleItem}
              onDeleteItem={deleteItem}
              onAddItems={kind => openAddItems(kind, {
                examId: activeExam.id,
                subjectId: activeExam.subjectId,
              })}
              onAddNote={n => addNote(n)}
              onDeleteNote={deleteNote} />
          )}
          {view === 'stats' && (
            <StatsView items={items} subjects={subjects} sessions={sessions} />
          )}
        </div>
      </main>

      {view === 'subjects' && (
        <button onClick={() => setModal({ type: 'subject' })}
          className="fixed bottom-24 left-4 z-30 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-2xl shadow-indigo-500/40 hover:scale-110 active:scale-95 transition-transform focus-ring">
          <IPlus size={24} />
        </button>
      )}
      {view === 'exams' && (
        <button onClick={() => {
          if (subjects.length === 0) {
            Sound.play('error');
            setModal({ type: 'needSubject' });
          } else {
            setModal({ type: 'exam' });
          }
        }}
          className="fixed bottom-24 left-4 z-30 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-2xl shadow-indigo-500/40 hover:scale-110 active:scale-95 transition-transform focus-ring">
          <IPlus size={24} />
        </button>
      )}

      <nav className="fixed bottom-0 left-0 right-0 z-30 glass border-t border-slate-200 dark:border-slate-800">
        <div className="mx-auto flex max-w-5xl items-center justify-around px-2 py-2">
          {[
            { id: 'dashboard', Icon: IBar,   label: 'الرئيسية' },
            { id: 'subjects',  Icon: IBook,  label: 'المواد' },
            { id: 'exams',     Icon: ITimer, label: 'اختبارات' },
            { id: 'stats',     Icon: ITrend, label: 'إحصائيات' },
          ].map(it => {
            const active = view === it.id
              || (it.id === 'subjects' && view === 'subject')
              || (it.id === 'exams' && view === 'exam');
            return (
              <button key={it.id} onClick={() => navigate(it.id)} data-sound="none"
                className={`flex flex-col items-center gap-0.5 rounded-xl px-4 py-1.5 transition-all focus-ring ${
                  active
                    ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/25'
                    : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}>
                <it.Icon size={18} />
                <span className="text-[10px] font-bold">{it.label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      {/* Modals */}
      {modal?.type === 'subject' && (
        <Modal onClose={closeModal}>
          <ModalHeader title="مادة جديدة" onClose={closeModal} />
          <AddSubjectForm onAdd={addSubject} onCancel={closeModal} />
        </Modal>
      )}
      {modal?.type === 'exam' && (
        <Modal onClose={closeModal}>
          <ModalHeader title="اختبار جديد" onClose={closeModal} />
          <AddExamForm subjects={subjects} onAdd={addExam} onCancel={closeModal} />
        </Modal>
      )}
      {modal?.type === 'items' && (
        <Modal onClose={closeModal}>
          <ModalHeader title={'إضافة إلى ' + LIST_META[modal.kind].label} onClose={closeModal} />
          <ItemCreator
            kind={modal.kind}
            subjectId={modal.subjectId}
            examId={modal.examId}
            onAdd={addItems}
            onCancel={closeModal} />
        </Modal>
      )}
      {modal?.type === 'pomodoro' && (
        <Modal onClose={closeModal}>
          <ModalHeader title="مؤقت بومودورو" onClose={closeModal} />
          <Pomodoro onSessionEnd={addSession} onCancel={closeModal} />
        </Modal>
      )}
      {modal?.type === 'confirm' && (
        <ConfirmModal
          what={modal.what}
          onCancel={closeModal}
          onConfirm={() => {
            if (modal.what === 'subject') deleteSubject(modal.id);
            if (modal.what === 'exam') deleteExam(modal.id);
          }} />
      )}
      {modal?.type === 'needSubject' && (
        <Modal onClose={closeModal}>
          <div className="p-6 text-center">
            <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-indigo-100 dark:bg-indigo-900/40">
              <IBook size={24} className="text-indigo-600 dark:text-indigo-400" />
            </div>
            <h3 className="text-lg font-bold">تحتاج مادة أولاً</h3>
            <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">
              كل اختبار يجب أن يندرج تحت مادة. أضف مادة أولاً ثم أضف اختبارك.
            </p>
            <div className="mt-6 flex gap-3">
              <button onClick={() => setModal({ type: 'subject' })} data-sound="add"
                className="flex-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 py-3 text-sm font-semibold text-white active:scale-95 transition-all focus-ring">
                إضافة مادة
              </button>
              <button onClick={closeModal}
                className="flex-1 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 py-3 text-sm font-medium text-slate-700 dark:text-slate-200 active:scale-95 transition-all focus-ring">
                إلغاء
              </button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================================================
   CONFIRM MODAL
   ============================================================ */
function ConfirmModal({ what, onCancel, onConfirm }) {
  const title = what === 'subject' ? 'حذف المادة؟' : 'حذف الاختبار؟';
  const desc = what === 'subject'
    ? 'سيتم حذف كل المهام والملاحظات والاختبارات المرتبطة بهذه المادة.'
    : 'سيتم حذف مهام التحضير والملاحظات المرتبطة بهذا الاختبار فقط.';
  return (
    <Modal onClose={onCancel}>
      <div className="p-6 text-center">
        <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30">
          <ITrash size={24} className="text-red-500" />
        </div>
        <h3 className="text-lg font-bold">{title}</h3>
        <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">{desc}</p>
        <div className="mt-6 flex gap-3">
          <button onClick={onConfirm} data-sound="delete"
            className="flex-1 rounded-xl bg-red-500 hover:bg-red-600 py-3 text-sm font-semibold text-white active:scale-95 transition-all focus-ring">
            حذف نهائي
          </button>
          <button onClick={onCancel}
            className="flex-1 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 py-3 text-sm font-medium text-slate-700 dark:text-slate-200 active:scale-95 transition-all focus-ring">
            إلغاء
          </button>
        </div>
      </div>
    </Modal>
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function Dashboard({ subjects, exams, items, sessions, onNavigate, onAddSubject, onAddExam }) {
  const upcoming = useMemo(() =>
    exams.map(e => ({ ...e, left: timeLeft(e.date) }))
      .filter(e => !e.left.isPast)
      .sort((a, b) => a.left.total - b.left.total), [exams]);

  const nearest = upcoming[0];
  const [, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  const left = nearest ? timeLeft(nearest.date) : null;
  const totalItems = items.length;
  const doneItems = items.filter(i => i.completed).length;
  const progress = totalItems ? Math.round((doneItems / totalItems) * 100) : 0;
  const todayDone = items.filter(i => i.completed && i.completedAt
    && new Date(i.completedAt).toDateString() === new Date().toDateString()).length;
  const totalStudyMin = Math.round(sessions.reduce((s, x) => s + (x.duration || 0), 0) / 60);

  return (
    <div className="space-y-5">
      {nearest ? (
        <button onClick={() => onNavigate('exam', nearest.id)} data-sound="open"
          className="relative w-full overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 p-6 text-white shadow-2xl text-right hover:scale-[1.005] transition-transform focus-ring">
          <div className="anim-pulse-soft absolute -top-20 -right-20 h-56 w-56 rounded-full bg-white/30 blur-3xl" />
          <div className="anim-pulse-soft absolute -bottom-28 -left-16 h-72 w-72 rounded-full bg-white/20 blur-3xl" style={{ animationDelay: '1.5s' }} />
          <div className="relative z-10">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2 text-white/90 text-sm">
                <IFlame size={18} className="text-yellow-300" />
                <span className="font-medium">أقرب اختبار</span>
              </div>

function ExamsView({ exams, items, subjects, onAdd, onDelete, onOpen }) {
  const sorted = useMemo(() => exams.slice().sort((a, b) => new Date(a.date) - new Date(b.date)), [exams]);

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold">الاختبارات</h1>
        <button onClick={onAdd}
          className="flex items-center gap-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 active:scale-95 transition-all focus-ring">
          <IPlus size={16} /> اختبار
        </button>
      </div>

      {sorted.length === 0 ? (
        <EmptyState Icon={ITimer} message="لا توجد اختبارات قادمة"
          action={{ label: 'أضف اختبار', onClick: onAdd }} />
      ) : (
        <div className="grid gap-4 sm:grid-cols-2">
          {sorted.map(e => {
            const examItems = items.filter(i => i.examId === e.id);
            const dn = examItems.filter(i => i.completed).length;
            const subject = subjects.find(s => s.id === e.subjectId);
            return (
              <ExamCard key={e.id} exam={e} subject={subject}
                taskCount={examItems.length} doneCount={dn}
                onDelete={() => onDelete(e.id)}
                onOpen={() => onOpen(e.id)} />
            );
          })}
        </div>
      )}
    </div>
  );
}

function ExamCard({ exam, subject, taskCount, doneCount, onDelete, onOpen }) {
  const [left, setLeft] = useState(() => timeLeft(exam.date));
  useEffect(() => {
    const id = setInterval(() => setLeft(timeLeft(exam.date)), 1000);
    return () => clearInterval(id);
  }, [exam.date]);

  const isPast = left.isPast;
  const isSoon = !isPast && left.total < 86400 * 3;

  return (
    <div onClick={onOpen} data-sound="open"
      className={`group relative overflow-hidden rounded-2xl p-5 shadow-lg cursor-pointer hover:scale-[1.02] transition-transform focus-ring ${
        isPast
          ? 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'
          : isSoon
            ? 'bg-gradient-to-br from-red-500 to-orange-500 text-white'
            : 'bg-gradient-to-br from-indigo-500 to-purple-600 text-white'
      }`}>
      {isSoon && (
        <div className="absolute top-2 left-2 flex items-center gap-1 rounded-full bg-white/25 px-2 py-1 text-[10px] font-bold backdrop-blur-sm">
          <IFlame size={10} /> قريب!
        </div>
      )}
      <div className="flex items-start justify-between gap-2">
        <div className="flex-1 min-w-0">
          <h3 className="font-bold text-lg truncate">{exam.title}</h3>
          {subject && (
            <p className={`text-xs mt-1 ${isPast ? 'text-slate-500 dark:text-slate-400' : 'text-white/90'}`}>
              <IBook size={10} className="inline" /> {subject.name}
            </p>
          )}
          <p className={`text-xs mt-1 ${isPast ? 'text-slate-500 dark:text-slate-400' : 'text-white/85'}`}>
            <ICal size={10} className="inline" />{' '}
            {new Date(exam.date).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' })}
          </p>
          {taskCount > 0 && (
            <p className={`text-xs mt-1 ${isPast ? 'text-slate-500 dark:text-slate-400' : 'text-white/85'}`}>
              <IList size={10} className="inline" /> {doneCount}/{taskCount} عنصر
            </p>
          )}
        </div>
        <button onClick={e => { e.stopPropagation(); onDelete(); }} data-sound="delete"
          className={`rounded-lg p-1.5 transition-colors focus-ring ${
            isPast ? 'hover:bg-slate-200 dark:hover:bg-slate-700' : 'hover:bg-white/25'
          }`}>
          <ITrash size={14} />
        </button>
      </div>
      {!isPast ? (
        <div className="mt-4 grid grid-cols-4 gap-2">
          {[
            { v: left.days, l: 'يوم' }, { v: left.hours, l: 'ساعة' },
            { v: left.minutes, l: 'دقيقة' }, { v: left.seconds, l: 'ثانية' },
          ].map(item => (
            <div key={item.l} className="rounded-xl bg-white/20 backdrop-blur-sm px-1 py-2 text-center border border-white/25">
              <div className="text-base font-bold tabular-nums">{pad(item.v)}</div>
              <div className="text-[9px] text-white/85">{item.l}</div>
            </div>
          ))}
        </div>
      ) : <p className="mt-4 text-sm font-medium">انتهى</p>}
    </div>
  );
}

          {items.length > 0 && (
            <div className="mt-6">
              <div className="flex justify-between text-xs text-white/90 mb-2">
                <span>التقدم في التحضير</span>
                <span>{done}/{items.length} · {Math.round(progress)}%</span>
              </div>
              <div className="h-2 rounded-full bg-white/20 overflow-hidden">
                <div className="h-full rounded-full bg-white transition-all duration-700"
                  style={{ width: progress + '%' }} />

      <SegmentedTabs
        value={tab}
        onChange={setTab}
        options={[
          { id: 'study', label: `المذاكرة (${studyItems.length})` },
          { id: 'review', label: `المراجعة (${reviewItems.length})` },
          { id: 'notes', label: `ملاحظات (${notes.length})` },

      />

      {tab === 'study' && (
        <ListPanel items={studyItems} kind="study"
          onToggle={onToggleItem} onDelete={onDeleteItem}
          onAdd={() => onAddItems('study')} />
      )}
      {tab === 'review' && (
        <ListPanel items={reviewItems} kind="review"
          onToggle={onToggleItem} onDelete={onDeleteItem}
          onAdd={() => onAddItems('review')} />
      )}
      {tab === 'notes' && (
        <NotesPanel
          notes={notes}
          onAdd={text => onAddNote({
            id: uid(), text,
            examId: exam.id, subjectId: exam.subjectId || null,
            createdAt: Date.now(),
          })}
          onDelete={onDeleteNote} />
      )}

      {tab !== 'notes' && (
        <button onClick={() => onAddItems(tab)} data-sound="add"
          className="w-full flex items-center justify-center gap-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 active:scale-[.98] transition-all focus-ring">
          <IPlus size={18} /> إضافة إلى {LIST_META[tab].label}
        </button>
      )}

      <p className="text-center text-[11px] text-slate-400 dark:text-slate-500">
        ✨ العناصر المضافة هنا تظهر تلقائياً في مادة: {subject?.name || '—'}
      </p>
    </div>
  );
}

/* ============================================================
   ITEM CREATOR
   ============================================================ */
function ItemCreator({ kind, subjectId, examId, onAdd, onCancel }) {
  const types = LIST_META[kind].types;
  const supportsRange = kind !== 'assignment';

  const [itemType, setItemType] = useState(types[0].id);
  const [mode, setMode] = useState(supportsRange ? 'range' : 'single');
  const [rangeFrom, setRangeFrom] = useState(1);
  const [rangeTo, setRangeTo] = useState(10);
  const [prefix, setPrefix] = useState('');
  const [singleTitle, setSingleTitle] = useState('');
  const [customItems, setCustomItems] = useState(['']);
  const [dueDate, setDueDate] = useState('');

  const typeObj = types.find(t => t.id === itemType);
  const typeLabel = typeObj?.label || '';

  const buildItem = (title, order) => {
    const base = {
      id: uid(), kind, type: itemType, title,
      completed: false, createdAt: Date.now(), order: order || 0,
      subjectId: subjectId || null,
      examId: examId || null,
    };
    if (kind === 'assignment' && dueDate) base.dueDate = dueDate;
    return base;
  };

  const handleSubmit = () => {
    if (mode === 'range' && supportsRange) {
      if (rangeTo < rangeFrom) return;
      const list = [];
      for (let i = 0; i < rangeTo - rangeFrom + 1; i++) {
        list.push(buildItem(`${prefix || typeLabel} ${rangeFrom + i}`, rangeFrom + i));
      }
      Sound.play('add');
      onAdd(list);
    } else if (mode === 'single') {
      if (!singleTitle.trim()) return;
      Sound.play('add');
      onAdd([buildItem(singleTitle.trim())]);
    } else {
      const list = customItems.filter(t => t.trim()).map((t, i) => buildItem(t.trim(), i + 1));
      if (!list.length) return;
      Sound.play('add');
      onAdd(list);
    }
  };

  const totalCount = rangeTo >= rangeFrom ? rangeTo - rangeFrom + 1 : 0;
  const preview = totalCount > 0
    ? Array.from({ length: Math.min(totalCount, 8) }, (_, i) => `${prefix || typeLabel} ${rangeFrom + i}`)
    : [];

  const canSubmit = mode === 'single' ? singleTitle.trim()
    : mode === 'range' ? totalCount > 0
    : customItems.some(t => t.trim());

  return (
    <div className="p-6 space-y-4">
      {examId && (
        <div className="rounded-xl bg-purple-50 dark:bg-purple-950/40 border border-purple-200 dark:border-purple-900/60 p-3 flex items-start gap-2">
          <ITimer size={14} className="text-purple-600 dark:text-purple-400 flex-shrink-0 mt-0.5" />
          <p className="text-[11px] text-purple-700 dark:text-purple-300 leading-relaxed">
            هذه العناصر ستُضاف إلى الاختبار <strong>و</strong> إلى مادتها تلقائياً.
          </p>
        </div>
      )}

      <div>
        <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">النوع</label>
        <div className={`grid gap-2 ${types.length > 4 ? 'grid-cols-3' : 'grid-cols-2'}`}>
          {types.map(type => {
            const active = itemType === type.id;
            return (
              <button key={type.id} onClick={() => setItemType(type.id)}
                className={`flex flex-col items-center gap-1 rounded-xl p-3 text-[11px] font-semibold transition-all border-2 focus-ring ${
                  active
                    ? 'border-indigo-500 dark:border-indigo-400'
                    : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'
                }`}
                style={active
                  ? { backgroundColor: type.color + '20', color: type.color }
                  : { color: 'inherit' }}>
                <type.Icon size={18} />
                {type.label}
              </button>
            );
          })}
        </div>
      </div>

      <div>
        <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">طريقة الإضافة</label>
        <SegmentedTabs
          size="sm"
          value={mode}
          onChange={setMode}
          options={[
            ...(supportsRange ? [{ id: 'range', label: 'نطاق' }] : []),
            { id: 'single', label: 'مفرد' },
            { id: 'custom', label: 'مخصص' },
          ]}
        />
      </div>

      {mode === 'range' && supportsRange && (
        <div className="space-y-3 anim-slide-down">
          <div>
            <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">البادئة (اختياري)</label>
            <input value={prefix} onChange={e => setPrefix(e.target.value)} placeholder={typeLabel}
              className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:border-indigo-500 transition-colors" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">من</label>
              <input type="number" min="1" value={rangeFrom}
                onChange={e => setRangeFrom(Math.max(1, Number(e.target.value) || 1))}
                className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-center font-bold text-slate-900 dark:text-slate-100 focus:border-indigo-500 transition-colors" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">إلى</label>
              <input type="number" min="1" value={rangeTo}
                onChange={e => setRangeTo(Math.max(1, Number(e.target.value) || 1))}
                className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-center font-bold text-slate-900 dark:text-slate-100 focus:border-indigo-500 transition-colors" />
            </div>
          </div>
          {totalCount > 0 && (
            <div className="rounded-xl bg-indigo-50 dark:bg-indigo-950/50 p-3 border border-indigo-200 dark:border-indigo-900/70">
              <p className="text-xs font-semibold text-indigo-700 dark:text-indigo-300 mb-2">
                سيتم إنشاء <strong>{totalCount}</strong> عنصر
              </p>
              <div className="flex flex-wrap gap-1.5">
                {preview.map((t, i) => (
                  <span key={i} className="rounded-md bg-white dark:bg-slate-900 px-2 py-1 text-[10px] font-semibold text-indigo-700 dark:text-indigo-300 shadow-sm border border-indigo-200 dark:border-indigo-900/70">
                    {t}
                  </span>
                ))}
                {totalCount > 8 && (
                  <span className="rounded-md bg-white dark:bg-slate-900 px-2 py-1 text-[10px] font-semibold text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">
                    +{totalCount - 8} أخرى
                  </span>
                )}
              </div>
            </div>
          )}
        </div>
      )}

      {mode === 'single' && (
        <div className="anim-slide-down">
          <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">عنوان العنصر</label>
          <input value={singleTitle} onChange={e => setSingleTitle(e.target.value)} autoFocus
            placeholder={kind === 'assignment' ? 'مثال: مشروع الفصل الأول...' : 'مثال: المحاضرة 1...'}
            onKeyDown={e => { if (e.key === 'Enter' && canSubmit) handleSubmit(); }}
            className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:border-indigo-500 transition-colors" />
        </div>
      )}

      {mode === 'custom' && (
        <div className="space-y-2 anim-slide-down">
          {customItems.map((item, idx) => (
            <div key={idx} className="flex gap-2">
              <input value={item}
                onChange={e => { const n = customItems.slice(); n[idx] = e.target.value; setCustomItems(n); }}
                placeholder={`العنصر ${idx + 1}`}
                onKeyDown={e => {
                  if (e.key === 'Enter' && idx === customItems.length - 1) {
                    e.preventDefault();
                    setCustomItems([...customItems, '']);
                  }
                }}
                className="flex-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2.5 text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:border-indigo-500 transition-colors" />
              {customItems.length > 1 && (
                <button onClick={() => setCustomItems(customItems.filter((_, i) => i !== idx))} data-sound="delete"
                  className="rounded-xl p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors focus-ring">
                  <ITrash size={16} />
                </button>
              )}
            </div>
          ))}
          <button onClick={() => setCustomItems([...customItems, ''])}
            className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline focus-ring rounded-lg px-2 py-1">
            + إضافة عنصر آخر
          </button>
        </div>
      )}

      {kind === 'assignment' && (
        <div className="anim-slide-down">
          <label className="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
            تاريخ التسليم (اختياري)
          </label>
          <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)}
            className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 focus:border-indigo-500 transition-colors" />
        </div>
      )}

      <div className="flex gap-3 pt-2">
        <button disabled={!canSubmit} onClick={handleSubmit} data-sound={canSubmit ? 'add' : 'none'}
          className={`flex-1 rounded-xl py-3 text-sm font-semibold text-white transition-all focus-ring ${
            canSubmit
              ? 'bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-500/25 active:scale-95'
              : 'bg-slate-300 dark:bg-slate-700 cursor-not-allowed'
          }`}>
          إضافة
        </button>
        <button onClick={onCancel}
          className="rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-5 py-3 text-sm font-medium text-slate-700 dark:text-slate-200 transition-colors focus-ring">
          إلغاء
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   STATS VIEW
   ============================================================ */
function StatsView({ items, subjects, sessions }) {
  const weekly = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.toDateString();
      const count = items.filter(it => it.completedAt && new Date(it.completedAt).toDateString() === key).length;
      days.push({ label: d.toLocaleDateString('ar-SA', { weekday: 'short' }), count });
    }
    return days;
  }, [items]);

  const max = Math.max(1, ...weekly.map(d => d.count));
  const totalMin = Math.round(sessions.reduce((s, x) => s + (x.duration || 0), 0) / 60);
  const done = items.filter(i => i.completed).length;
  const rate = items.length ? Math.round((done / items.length) * 100) : 0;

  const bySubject = subjects.map(s => {
    const st = items.filter(i => i.subjectId === s.id);
    return { ...s, total: st.length, done: st.filter(i => i.completed).length };
  }).sort((a, b) => b.total - a.total);

  const byKind = ['study', 'review', 'assignment'].map(k => {
    const ki = items.filter(i => i.kind === k);
    return { kind: k, total: ki.length, done: ki.filter(i => i.completed).length };
  });

  return (
    <div className="space-y-5">
      <h1 className="text-2xl font-bold">الإحصائيات</h1>

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
        {[
          { v: done, l: 'مكتمل', c1: '#10B981', c2: '#14B8A6' },
          { v: rate + '%', l: 'نسبة الإنجاز', c1: '#6366F1', c2: '#8B5CF6' },
          { v: totalMin + 'د', l: 'وقت المذاكرة', c1: '#F59E0B', c2: '#F97316' },
          { v: sessions.length, l: 'جلسات بومودورو', c1: '#EC4899', c2: '#F43F5E' },
        ].map(s => (
          <div key={s.l} className="rounded-2xl bg-white dark:bg-slate-900 p-4 border border-slate-200 dark:border-slate-800">
            <div className="h-1 w-10 rounded-full" style={{ background: `linear-gradient(90deg, ${s.c1}, ${s.c2})` }} />
            <div className="mt-3 text-2xl font-bold">{s.v}</div>
            <div className="text-xs text-slate-500 dark:text-slate-400">{s.l}</div>
          </div>
        ))}
      </div>

      <div className="rounded-2xl bg-white dark:bg-slate-900 p-5 border border-slate-200 dark:border-slate-800">
        <h3 className="font-bold mb-4">نشاط الأسبوع</h3>
        <div className="flex items-end justify-between gap-2 h-32">
          {weekly.map((d, i) => {
            const h = (d.count / max) * 100;
            return (
              <div key={i} className="flex-1 flex flex-col items-center gap-2 h-full justify-end">
                <div className="w-full rounded-t-lg transition-all duration-700"
                  style={{
                    height: (h > 0 ? h : 3) + '%',
                    minHeight: '4px',
                    background: d.count > 0 ? 'linear-gradient(to top, #6366F1, #8B5CF6)' : '#e2e8f0',
                  }} />
                <span className="text-[10px] text-slate-500 dark:text-slate-400">{d.label}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="rounded-2xl bg-white dark:bg-slate-900 p-5 border border-slate-200 dark:border-slate-800">
        <h3 className="font-bold mb-4">التقدم حسب القائمة</h3>
        <div className="space-y-3">
          {byKind.map(k => {
            const meta = LIST_META[k.kind];
            const p = k.total ? (k.done / k.total) * 100 : 0;
            return (
              <div key={k.kind}>
                <div className="flex items-center justify-between text-sm mb-1">
                  <div className="flex items-center gap-2">
                    <meta.icon size={14} className="text-indigo-500" />
                    <span className="font-medium text-slate-700 dark:text-slate-200">{meta.label}</span>
                  </div>
                  <span className="text-xs text-slate-500 dark:text-slate-400">{k.done}/{k.total}</span>
                </div>
                <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                  <div className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 transition-all duration-700"
                    style={{ width: p + '%' }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {bySubject.length > 0 && (
        <div className="rounded-2xl bg-white dark:bg-slate-900 p-5 border border-slate-200 dark:border-slate-800">
          <h3 className="font-bold mb-4">التقدم حسب المادة</h3>
          <div className="space-y-3">
            {bySubject.map(s => {
              const p = s.total ? (s.done / s.total) * 100 : 0;
              return (
                <div key={s.id}>
                  <div className="flex items-center justify-between text-sm mb-1">
                    <div className="flex items-center gap-2">
                      <div className="h-3 w-3 rounded-full" style={{ backgroundColor: s.color }} />
                      <span className="font-medium text-slate-700 dark:text-slate-200">{s.name}</span>
                    </div>
                    <span className="text-xs text-slate-500 dark:text-slate-400">{s.done}/{s.total}</span>
                  </div>
                  <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-700"
                      style={{ width: p + '%', backgroundColor: s.color }} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   POMODORO
   ============================================================ */
function Pomodoro({ onSessionEnd, onCancel }) {
  const MODES = {
    focus: { label: 'تركيز', min: 25, color: '#6366F1' },
    short: { label: 'راحة قصيرة', min: 5, color: '#10B981' },
    long:  { label: 'راحة طويلة', min: 15, color: '#F59E0B' },
  };
  const [mode, setMode] = useState('focus');
  const [seconds, setSeconds] = useState(25 * 60);
  const [running, setRunning] = useState(false);

  useEffect(() => { setSeconds(MODES[mode].min * 60); setRunning(false); }, [mode]);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setSeconds(s => {
        if (s <= 1) {
          setRunning(false);
          Sound.play('success');
          if (mode === 'focus') onSessionEnd({ id: uid(), duration: MODES.focus.min * 60, endedAt: Date.now() });
          return 0;
        }
        return s - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running, mode, onSessionEnd]);

  const total = MODES[mode].min * 60;
  const progress = ((total - seconds) / total) * 100;
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  const R = 90, C = 2 * Math.PI * R;

  return (
    <div className="p-6 text-center space-y-5">
      <SegmentedTabs
        value={mode}
        onChange={setMode}
        options={Object.keys(MODES).map(k => ({ id: k, label: MODES[k].label }))}
      />

      <div className="relative mx-auto" style={{ width: 220, height: 220 }}>
        <svg className="absolute inset-0 -rotate-90" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r={R} fill="none" strokeWidth="10"
            className="text-slate-200 dark:text-slate-800" stroke="currentColor" />
          <circle cx="110" cy="110" r={R} fill="none" stroke={MODES[mode].color} strokeWidth="10"
            strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - progress / 100)}
            style={{ transition: 'stroke-dashoffset .5s linear' }} />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <div className="text-5xl font-bold tabular-nums">{pad(m)}:{pad(s)}</div>
          <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">{MODES[mode].label}</div>
        </div>
      </div>

      <div className="flex justify-center gap-3">
        <button onClick={() => setRunning(!running)}
          data-sound={running ? 'click' : 'open'}
          className="flex items-center gap-2 rounded-xl px-8 py-3 text-sm font-semibold text-white shadow-lg active:scale-95 transition-transform focus-ring hover:brightness-110"
          style={{ backgroundColor: MODES[mode].color }}>
          {running ? <IPause size={18} /> : <IPlay size={18} />}
          {running ? 'إيقاف' : 'ابدأ'}
        </button>
        <button onClick={() => { setSeconds(MODES[mode].min * 60); setRunning(false); }}
          className="rounded-xl bg-slate-100 dark:bg-slate-800 p-3 text-slate-600 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all focus-ring">
          <IReset size={18} />
        </button>
      </div>

      <p className="text-xs text-slate-500 dark:text-slate-400">جلسات التركيز تُحفظ تلقائياً ✨</p>
    </div>
  );
}

/* ============================================================
   RENDER
   ============================================================ */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
